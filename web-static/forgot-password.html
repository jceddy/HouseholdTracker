<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
    (function () {
        var pref = localStorage.getItem('themePreference');
        if (pref && pref !== 'system') document.documentElement.dataset.theme = pref;
    })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - HouseholdTracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
    <h1>Forgot password</h1>
    <form id="forgot-password-form">
        <label>Email
            <input type="email" id="email" name="email" autocomplete="email" required>
        </label>
        <button type="submit">Send reset link</button>
        <p id="forgot-password-message" class="message" hidden></p>
    </form>
    <p class="form-links">
        <a href="/">Back to login</a>
    </p>
</main>
<footer>
    <select id="theme-select">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
    </select>
    <span id="app-version"></span>
</footer>
<script src="/js/app.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
