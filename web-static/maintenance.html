<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
    (function () {
        var pref = localStorage.getItem('themePreference');
        if (pref && pref !== 'system') document.documentElement.dataset.theme = pref;
    })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under maintenance - HouseholdTracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
    <h1>Under maintenance</h1>
    <p id="maintenance-message"></p>
    <button id="retry-button" type="button">Retry now</button>
</main>
<footer>
    <span id="app-version"></span>
</footer>
<script src="/js/maintenance.js"></script>
</body>
</html>
