<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
    (function () {
        var pref = localStorage.getItem('themePreference');
        if (pref && pref !== 'system') document.documentElement.dataset.theme = pref;
    })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - HouseholdTracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
    <h1>HouseholdTracker</h1>
    <form id="login-form">
        <label>Username
            <input type="text" id="username" name="username" autocomplete="username" required>
        </label>
        <label>Password
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <p id="login-message" class="message" hidden></p>
    </form>
    <p class="form-links">
        <a href="/register.html">Create an account</a>
        <a href="/forgot-password.html">Forgot password?</a>
    </p>
    <p class="form-links">
        <a href="/resend-verification.html">Resend verification email</a>
    </p>
</main>
<footer>
    <select id="theme-select">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
    </select>
    <span id="app-version"></span>
</footer>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
